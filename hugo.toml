baseURL = 'https://huro0906.github.io/'
locale = 'ko-kr'
timeZone = 'Asia/Seoul'
title = '이것저것'
enableRobotsTXT = true
hasCJKLanguage = true
capitalizeListTitles = false

[params]
  subtitle = '적어놓자'
  description = '넹'
  github = 'https://github.com/huro0906'
  # 홈 첫 화면에 보여 줄 프로필 사진 주소입니다.
  avatar = 'https://github.com/huro0906.png'

  [params.author]
    name = 'huro0906'

  # 홈 첫 화면(hero)의 닉네임과 한 줄 문구입니다. title 이 비어 있으면 사이트 제목을 씁니다.
  [params.hero]
    title = 'huro0906'
    intro = 'huro0906의 개발 블로그'

[taxonomies]
  tag = 'tags'
  category = 'categories'
  series = 'series'

[permalinks.page]
  posts = '/posts/:slug/'

[related]
  includeNewer = true
  threshold = 80
  toLower = false
  [[related.indices]]
    name = 'tags'
    weight = 100
  [[related.indices]]
    name = 'categories'
    weight = 60

# 3열과 2열 카드 격자에서 마지막 줄이 비지 않도록 12의 배수로 둡니다.
[pagination]
  pagerSize = 12

[imaging.webp]
  quality = 80

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

[menus]
  [[menus.main]]
    name = '홈'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = '글'
    pageRef = '/posts'
    weight = 20
  [[menus.main]]
    name = '카테고리'
    pageRef = '/categories'
    weight = 30
  [[menus.main]]
    name = '태그'
    pageRef = '/tags'
    weight = 40
  [[menus.main]]
    name = '소개'
    pageRef = '/about'
    weight = 50
