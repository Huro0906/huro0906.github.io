<footer class="site-footer">
  <div class="container footer-inner">
    <span>&copy; {{ now.Year }} {{ site.Params.author.name }}</span>
    <span class="footer-links">
      {{- with site.Params.github }}<a href="{{ . }}" rel="me noopener">GitHub</a>{{ end }}
      {{- with site.Home.OutputFormats.Get "rss" }}<a href="{{ .Permalink }}">RSS</a>{{ end }}
    </span>
  </div>
</footer>
