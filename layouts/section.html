{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
</header>
{{- with .RegularPages }}
{{- range .GroupByDate "2006" }}
<section class="card archive-year">
  <h2 class="label">{{ .Key }}</h2>
  <ul class="archive-list">
    {{- range .Pages }}
    <li>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01.02" }}</time>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{- end }}
  </ul>
</section>
{{- end }}
{{- else }}
<section class="card empty-state pixel-corners" data-empty-state>
  <p class="label">EMPTY</p>
  <p>아직 올라온 글이 없습니다.</p>
</section>
{{- end }}
{{ end }}
