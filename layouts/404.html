{{ define "main" }}
<section class="card not-found pixel-corners">
  <svg class="pixel-art" viewBox="0 0 11 11" width="128" height="128" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
    <g class="px-ink">
      <rect x="1" y="3" width="1" height="1"/><rect x="5" y="3" width="1" height="1"/><rect x="1" y="4" width="5" height="3"/>
      <rect x="2" y="7" width="6" height="2"/><rect x="8" y="5" width="1" height="3"/><rect x="9" y="4" width="1" height="1"/>
    </g>
    <g class="px-eye"><rect x="2" y="5" width="1" height="1"/><rect x="4" y="5" width="1" height="1"/></g>
  </svg>
  <p class="label">404 NOT FOUND</p>
  <h1>페이지를 찾을 수 없습니다.</h1>
  <p>주소가 바뀌었거나 아직 없는 페이지입니다.</p>
  <a class="btn" href="{{ "/" | relURL }}">홈으로 가기</a>
</section>
{{ end }}
